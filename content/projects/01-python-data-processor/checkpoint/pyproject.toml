[project]
name = "incident-report"
version = "0.1.0"
description = "Nightly incident report for the fictional Orbital Logistics on-call team"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
incident-report = "incident_report.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest]
testpaths = ["tests"]
addopts = ["-ra", "--import-mode=importlib"]
