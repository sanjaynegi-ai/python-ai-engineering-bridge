[project]
name = "knowledge-assistant"
version = "0.1.0"
description = "Answer questions about the fictional Orbital Logistics IT documentation, with sources"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastembed>=0.9.0",
    "langchain-text-splitters>=1.1.3",
    "numpy>=2.5.4",
    "pydantic-settings>=2.16.1",
    "pypdf>=6.21.2",
]

[project.scripts]
knowledge-assistant = "knowledge_assistant.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest]
testpaths = ["tests"]
addopts = ["-ra", "--import-mode=importlib"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
