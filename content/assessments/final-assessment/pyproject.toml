[project]
name = "swap-desk"
version = "0.1.0"
description = "On-call swap requests for the fictional Orbital Logistics IT operations teams"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.161.1",
    "openai>=3.37.0",
]

[project.scripts]
swap-desk = "swap_desk.command:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest]
testpaths = ["tests"]
addopts = ["-ra", "--import-mode=importlib"]

