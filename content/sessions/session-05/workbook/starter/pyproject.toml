[project]
name = "asset-lookup"
version = "0.1.0"
description = "Client and command-line tool for the fictional Orbital Logistics Asset Inventory API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
asset-lookup = "asset_lookup.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest]
testpaths = ["tests"]
addopts = ["-ra", "--import-mode=importlib"]
