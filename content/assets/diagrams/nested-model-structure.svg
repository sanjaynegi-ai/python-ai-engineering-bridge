<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" style="font-variant-ligatures: none" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">A nested model and the JSON it becomes</title>
  <desc id="desc">The Report model contains other models: a Totals model, a dictionary of TeamStats keyed by team, and lists of Breach, TagCount and Rejection models, plus a datetime. On the right, model_dump_json turns the whole tree into JSON: models become objects, lists become arrays, the datetime becomes an ISO 8601 string. model_validate_json reads the same JSON back, validating every level. Exclude removes a field from the output.</desc>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/>
    </marker>
  </defs>

  <rect width="960" height="620" fill="#FFFFFF"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">A nested model and the JSON it becomes</text>

  <!-- left: model tree -->
  <rect x="20" y="58" width="440" height="470" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="240" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A8A">Python: models inside models</text>

  <rect x="40" y="100" width="400" height="40" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="56" y="126" font-size="15" font-weight="700" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" fill="#1E3A8A">Report</text>

  <g font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="13" fill="#1E3A8A">
    <rect x="80" y="160" width="360" height="34" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="94" y="182">generated_at: datetime</text>

    <rect x="80" y="206" width="360" height="52" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="94" y="228">totals: Totals</text>
    <text x="110" y="248" fill="#334155">valid_records, open, breached ...</text>

    <rect x="80" y="270" width="360" height="52" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="94" y="292">teams: dict[str, TeamStats]</text>
    <text x="110" y="312" fill="#334155">"platform" → TeamStats(open=2, ...)</text>

    <rect x="80" y="334" width="360" height="52" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="94" y="356">breaches: list[Breach]</text>
    <text x="110" y="376" fill="#334155">Breach(id, title, team, ...)</text>

    <rect x="80" y="398" width="360" height="34" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="94" y="420">top_tags: list[TagCount]</text>

    <rect x="80" y="444" width="360" height="52" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="94" y="466">rejected: list[Rejection]</text>
    <text x="110" y="486" fill="#334155">Rejection(file, record, id, problems)</text>
  </g>
  <g stroke="#2563EB" stroke-width="1.5" fill="none">
    <path d="M60,140 L60,477 M60,177 L80,177 M60,232 L80,232 M60,296 L80,296 M60,360 L80,360 M60,415 L80,415 M60,470 L80,470"/>
  </g>
  <text x="40" y="516" font-size="12" fill="#1E3A8A">Every level is validated, so a whole report can be trusted as one object.</text>

  <!-- arrows -->
  <line x1="466" y1="250" x2="530" y2="250" stroke="#0D9488" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <text x="472" y="240" font-size="12" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" fill="#115E59">dump</text>
  <line x1="530" y1="300" x2="466" y2="300" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="472" y="322" font-size="12" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" fill="#1E3A8A">validate</text>

  <!-- right: JSON -->
  <rect x="536" y="58" width="404" height="470" rx="12" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.5"/>
  <text x="738" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#115E59">JSON: model_dump_json(indent=2)</text>
  <g font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="13" fill="#115E59">
    <text x="556" y="116">{</text>
    <text x="572" y="138">"generated_at": "2026-10-21T02:00:00Z",</text>
    <text x="572" y="160">"totals": {"valid_records": 11, ...},</text>
    <text x="572" y="182">"teams": {</text>
    <text x="588" y="204">"platform": {"open": 2, ...},</text>
    <text x="588" y="226">...</text>
    <text x="572" y="248">},</text>
    <text x="572" y="270">"breaches": [</text>
    <text x="588" y="292">{"id": "INC-3007", ...},</text>
    <text x="588" y="314">...</text>
    <text x="572" y="336">],</text>
    <text x="572" y="358">"top_tags": [{"tag": "latency",</text>
    <text x="588" y="380">"count": 3}, ...],</text>
    <text x="572" y="402">"rejected": [...]</text>
    <text x="556" y="424">}</text>
  </g>
  <text x="556" y="460" font-size="12" fill="#115E59">model → object · list → array · datetime → ISO string</text>
  <text x="556" y="480" font-size="12" fill="#115E59">tuple → array · None → null</text>
  <text x="556" y="508" font-size="12" fill="#115E59"><tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">Report.model_validate_json(text)</tspan> reads it back.</text>

  <!-- footer -->
  <rect x="20" y="548" width="920" height="56" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="40" y="572" font-size="13" fill="#92400E"><tspan font-weight="700">Controlling the output:</tspan> <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">exclude={"rejected"}</tspan> drops a field; <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">include={...}</tspan> keeps only some;</text>
  <text x="40" y="592" font-size="13" fill="#92400E"><tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">by_alias=True</tspan> renames fields that declare an alias, e.g. <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">ticket_id</tspan> in Python, <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">ticketId</tspan> in JSON.</text>
</svg>
