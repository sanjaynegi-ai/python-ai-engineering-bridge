<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" style="font-variant-ligatures: none" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">How a LangChain chain runs</title>
  <desc id="desc">The chain is PROMPT piped into a chat model with structured output. invoke is called with a dict holding the report. The ChatPromptTemplate fills its variable and produces two messages, a system message with the instructions and a human message with the report. The chat model sends them to the provider and receives an AI message. With include_raw=True, the structured-output step returns a dict with raw, the AI message with token usage and any refusal, parsed, the TriageResult or None, and parsing_error. Your code turns that into a Triage or a TriageError. Every step is a Runnable, with the same methods: invoke, batch, stream and their async versions, and wrappers such as with_retry and with_fallbacks.</desc>

  <defs>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
  </defs>

  <rect width="960" height="520" fill="#FFFFFF"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">How a LangChain chain runs</text>
  <text x="480" y="62" text-anchor="middle" font-size="14" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" fill="#4C1D95">chain = PROMPT | model.with_structured_output(TriageResult, include_raw=True)</text>

  <!-- input -->
  <rect x="24" y="90" width="190" height="96" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="38" y="114" font-size="14" font-weight="700" fill="#1E3A8A">chain.invoke(...)</text>
  <g font-size="12" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" fill="#1E3A8A">
    <text x="38" y="138">{"report":</text>
    <text x="50" y="156">"VPN keeps</text>
    <text x="50" y="174">dropping ..."}</text>
  </g>
  <line x1="214" y1="138" x2="238" y2="138" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- prompt -->
  <rect x="242" y="90" width="210" height="96" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="256" y="114" font-size="14" font-weight="700" fill="#4C1D95">ChatPromptTemplate</text>
  <g font-size="12" fill="#4C1D95">
    <text x="256" y="136">fills <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">{report}</tspan>, returns:</text>
    <text x="256" y="156">• SystemMessage: instructions</text>
    <text x="256" y="174">• HumanMessage: the report</text>
  </g>
  <line x1="452" y1="138" x2="476" y2="138" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- model -->
  <rect x="480" y="90" width="226" height="96" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="494" y="114" font-size="14" font-weight="700" fill="#4C1D95">ChatOpenAI, structured</text>
  <g font-size="12" fill="#4C1D95">
    <text x="494" y="136">sends messages + JSON schema</text>
    <text x="494" y="156">(via the OpenAI SDK); gets an</text>
    <text x="494" y="174">AIMessage; parses it</text>
  </g>
  <line x1="706" y1="138" x2="730" y2="138" stroke="#0D9488" stroke-width="2" marker-end="url(#arrow-teal)"/>

  <!-- output -->
  <rect x="734" y="90" width="202" height="96" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/>
  <text x="748" y="114" font-size="14" font-weight="700" fill="#115E59">a dict</text>
  <g font-size="12" fill="#115E59">
    <text x="748" y="136"><tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">raw</tspan>: AIMessage (usage,</text>
    <text x="760" y="154">refusal, model name)</text>
    <text x="748" y="172"><tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">parsed</tspan>, <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">parsing_error</tspan></text>
  </g>

  <line x1="835" y1="186" x2="835" y2="214" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="560" y="218" width="376" height="56" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="574" y="241" font-size="14" font-weight="700" fill="#1E3A8A">Your code: <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-weight="400">LangChainTriager.triage</tspan></text>
  <text x="574" y="262" font-size="12" fill="#1E3A8A">→ a Triage, or a TriageError: the same contract as Session 09</text>

  <!-- runnable interface -->
  <rect x="24" y="300" width="912" height="200" rx="12" fill="#F8FAFC" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="40" y="326" font-size="15" font-weight="700" fill="#4C1D95">Every box above is a Runnable, and so is the whole chain</text>
  <g font-size="13" fill="#4C1D95">
    <text x="40" y="352"><tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-weight="700">invoke</tspan>(input) → output · <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-weight="700">batch</tspan>(inputs, config={"max_concurrency": 4}) → outputs, run in threads</text>
    <text x="40" y="376"><tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-weight="700">stream</tspan>(input) → chunks as they arrive · <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-weight="700">ainvoke</tspan>, <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-weight="700">abatch</tspan>, <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-weight="700">astream</tspan>: the async versions (Session 08)</text>
    <text x="40" y="400"><tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-weight="700">a | b</tspan>: b receives a's output · <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-weight="700">RunnableLambda</tspan>(f): any function as a step</text>
    <text x="40" y="424"><tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-weight="700">with_retry</tspan>(...) · <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-weight="700">with_fallbacks</tspan>([other]) · <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-weight="700">with_config</tspan>(tags=..., callbacks=...)</text>
  </g>
  <rect x="40" y="440" width="880" height="44" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="56" y="467" font-size="13" fill="#92400E"><tspan font-weight="700">⚠ Same interface, different behaviour:</tspan> what <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">invoke</tspan> raises, retries or returns depends on each component. Test it.</text>
</svg>
