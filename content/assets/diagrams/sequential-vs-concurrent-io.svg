<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" style="font-variant-ligatures: none" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">Sequential versus concurrent I/O</title>
  <desc id="desc">Two timelines of four HTTP requests, one per team. Each request is a short burst of Python work to send it, a long wait for the network, and a short burst to parse the answer. Done sequentially, each request starts only when the previous one has finished, so the total is about four times one request. Done concurrently with asyncio.gather, all four are sent at once and their waits overlap, so the total is about one request. Concurrency helps because the time is spent waiting, not computing; CPU-bound work does not overlap this way.</desc>

  <defs>
    <pattern id="wait" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#F1F5F9"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#64748B" stroke-width="2" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="960" height="560" fill="#FFFFFF"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">Sequential versus concurrent I/O</text>

  <!-- legend -->
  <rect x="200" y="56" width="18" height="14" rx="2" fill="#2563EB"/>
  <text x="226" y="68" font-size="13" fill="#1E3A8A">Python running: send the request, parse the answer</text>
  <rect x="560" y="56" width="18" height="14" rx="2" fill="url(#wait)" stroke="#64748B" stroke-width="1.5"/>
  <text x="586" y="68" font-size="13" fill="#334155">waiting for the network</text>

  <!-- sequential panel -->
  <rect x="24" y="86" width="912" height="190" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  <text x="40" y="110" font-size="15" font-weight="700" fill="#0F172A">Sequential: <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-weight="400">for team in teams: await fetch(team)</tspan></text>

  <g font-size="12" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" fill="#334155">
    <text x="40" y="141">database</text>
    <text x="40" y="171">it-support</text>
    <text x="40" y="201">network</text>
    <text x="40" y="231">platform</text>
  </g>
  <!-- rows: start x = 200 + i*160; send 10, wait 140, parse 10 -->
  <g>
    <rect x="200" y="128" width="10" height="20" fill="#2563EB"/><rect x="210" y="128" width="140" height="20" fill="url(#wait)" stroke="#64748B" stroke-width="1"/><rect x="350" y="128" width="10" height="20" fill="#2563EB"/>
    <rect x="360" y="158" width="10" height="20" fill="#2563EB"/><rect x="370" y="158" width="140" height="20" fill="url(#wait)" stroke="#64748B" stroke-width="1"/><rect x="510" y="158" width="10" height="20" fill="#2563EB"/>
    <rect x="520" y="188" width="10" height="20" fill="#2563EB"/><rect x="530" y="188" width="140" height="20" fill="url(#wait)" stroke="#64748B" stroke-width="1"/><rect x="670" y="188" width="10" height="20" fill="#2563EB"/>
    <rect x="680" y="218" width="10" height="20" fill="#2563EB"/><rect x="690" y="218" width="140" height="20" fill="url(#wait)" stroke="#64748B" stroke-width="1"/><rect x="830" y="218" width="10" height="20" fill="#2563EB"/>
  </g>
  <line x1="840" y1="120" x2="840" y2="250" stroke="#D97706" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="836" y="266" text-anchor="end" font-size="13" font-weight="700" fill="#92400E">total ≈ 4 × one request</text>

  <!-- concurrent panel -->
  <rect x="24" y="290" width="912" height="190" rx="12" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.5"/>
  <text x="40" y="314" font-size="15" font-weight="700" fill="#115E59">Concurrent: <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-weight="400">await asyncio.gather(*(fetch(team) for team in teams))</tspan></text>

  <g font-size="12" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" fill="#115E59">
    <text x="40" y="345">database</text>
    <text x="40" y="375">it-support</text>
    <text x="40" y="405">network</text>
    <text x="40" y="435">platform</text>
  </g>
  <g>
    <rect x="200" y="332" width="10" height="20" fill="#2563EB"/><rect x="210" y="332" width="140" height="20" fill="url(#wait)" stroke="#64748B" stroke-width="1"/><rect x="350" y="332" width="10" height="20" fill="#2563EB"/>
    <rect x="210" y="362" width="10" height="20" fill="#2563EB"/><rect x="220" y="362" width="150" height="20" fill="url(#wait)" stroke="#64748B" stroke-width="1"/><rect x="370" y="362" width="10" height="20" fill="#2563EB"/>
    <rect x="220" y="392" width="10" height="20" fill="#2563EB"/><rect x="230" y="392" width="130" height="20" fill="url(#wait)" stroke="#64748B" stroke-width="1"/><rect x="360" y="392" width="10" height="20" fill="#2563EB"/>
    <rect x="230" y="422" width="10" height="20" fill="#2563EB"/><rect x="240" y="422" width="140" height="20" fill="url(#wait)" stroke="#64748B" stroke-width="1"/><rect x="380" y="422" width="10" height="20" fill="#2563EB"/>
  </g>
  <line x1="390" y1="324" x2="390" y2="454" stroke="#0D9488" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="398" y="470" font-size="13" font-weight="700" fill="#115E59">✓ total ≈ the slowest single request</text>
  <text x="420" y="350" font-size="13" fill="#115E59">the four waits overlap: while one request</text>
  <text x="420" y="370" font-size="13" fill="#115E59">waits, the event loop sends or parses another</text>
  <text x="420" y="398" font-size="13" fill="#115E59">the blue blocks never overlap: one thread</text>
  <text x="420" y="418" font-size="13" fill="#115E59">runs Python code one piece at a time</text>

  <!-- axis -->
  <line x1="200" y1="496" x2="860" y2="496" stroke="#64748B" stroke-width="1.5"/>
  <text x="200" y="514" text-anchor="middle" font-size="12" fill="#334155">0</text>
  <text x="530" y="514" text-anchor="middle" font-size="12" fill="#334155">time →</text>

  <!-- caveat -->
  <rect x="24" y="524" width="912" height="30" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="40" y="544" font-size="13" fill="#92400E"><tspan font-weight="700">⚠ Only waiting overlaps.</tspan> If the blue blocks were long (CPU-bound work), async would not make the total shorter.</text>
</svg>
