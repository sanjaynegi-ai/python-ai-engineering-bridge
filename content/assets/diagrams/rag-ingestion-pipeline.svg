<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" style="font-variant-ligatures: none" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">The ingestion pipeline</title>
  <desc id="desc">Ingestion turns files into searchable chunks. A Markdown file is read as text, with its title from the first heading; a PDF is read page by page with pypdf, and its whitespace normalised. Each document is split into sections at its headings, then each section into chunks of a maximum size with some overlap between neighbours. Every chunk keeps metadata: the source file, title, section, page and its position. The chunks' text is embedded in batches, one vector per chunk, and the store keeps the vectors, the text, the metadata and the ID of the embedding model.</desc>

  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="#FFFFFF"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">The ingestion pipeline: files to searchable chunks</text>

  <!-- 1 load -->
  <rect x="24" y="60" width="290" height="190" rx="12" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/>
  <text x="40" y="86" font-size="15" font-weight="700" fill="#115E59">1  Load and extract</text>
  <g font-size="13" fill="#115E59">
    <text x="40" y="112"><tspan font-weight="700">.md</tspan>: read as UTF-8 text;</text>
    <text x="40" y="130">the title is the first heading</text>
    <text x="40" y="158"><tspan font-weight="700">.pdf</tspan>: pypdf, page by page;</text>
    <text x="40" y="176">normalise whitespace (PDF text</text>
    <text x="40" y="194">breaks lines mid-sentence)</text>
    <text x="40" y="222">scanned PDFs have no text at all:</text>
    <text x="40" y="240">report them, don't index nothing</text>
  </g>
  <line x1="314" y1="155" x2="342" y2="155" stroke="#0D9488" stroke-width="2" marker-end="url(#arrow-teal)"/>

  <!-- 2 chunk -->
  <rect x="346" y="60" width="290" height="190" rx="12" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/>
  <text x="362" y="86" font-size="15" font-weight="700" fill="#115E59">2  Split into chunks</text>
  <g font-size="13" fill="#115E59">
    <text x="362" y="112">first at headings (sections),</text>
    <text x="362" y="130">then by size, at paragraph or</text>
    <text x="362" y="148">sentence boundaries</text>
  </g>
  <g>
    <rect x="362" y="164" width="120" height="22" rx="4" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.5"/>
    <rect x="452" y="194" width="120" height="22" rx="4" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.5"/>
    <rect x="542" y="224" width="80" height="22" rx="4" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.5"/>
    <text x="490" y="180" font-size="11" fill="#115E59">neighbours overlap a little</text>
  </g>
  <line x1="636" y1="155" x2="664" y2="155" stroke="#0D9488" stroke-width="2" marker-end="url(#arrow-teal)"/>

  <!-- 3 metadata -->
  <rect x="668" y="60" width="268" height="190" rx="12" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/>
  <text x="684" y="86" font-size="15" font-weight="700" fill="#115E59">3  Keep metadata</text>
  <g font-size="12" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" fill="#115E59">
    <text x="684" y="112">source:  runbook-vpn-outage.md</text>
    <text x="684" y="130">title:   Runbook: Office VPN</text>
    <text x="684" y="148">section: Diagnose</text>
    <text x="684" y="166">page:    null (PDF: 1, 2 ...)</text>
    <text x="684" y="184">index:   2</text>
    <text x="684" y="202">text:    "1. Check the ..."</text>
  </g>
  <text x="684" y="232" font-size="12" fill="#115E59">without it, you can't cite sources</text>

  <line x1="802" y1="250" x2="802" y2="284" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- 4 embed -->
  <rect x="490" y="288" width="446" height="104" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="506" y="314" font-size="15" font-weight="700" fill="#4C1D95">4  Embed, in batches</text>
  <g font-size="13" fill="#4C1D95">
    <text x="506" y="340">one vector per chunk: 384 numbers with bge-small,</text>
    <text x="506" y="360">1,536 with OpenAI's text-embedding-3-small</text>
    <text x="506" y="380">the slow, and possibly paid, step: do it once per change</text>
  </g>
  <line x1="490" y1="340" x2="462" y2="340" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- 5 store -->
  <rect x="24" y="288" width="434" height="104" rx="12" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <text x="40" y="314" font-size="15" font-weight="700" fill="#334155">5  Store</text>
  <g font-size="13" fill="#334155">
    <text x="40" y="340">a matrix of vectors (one row per chunk), the chunks'</text>
    <text x="40" y="360">text and metadata in the same order, and the ID of the</text>
    <text x="40" y="380">embedding model that made them</text>
  </g>

  <!-- notes -->
  <rect x="24" y="414" width="912" height="108" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="40" y="438" font-size="14" font-weight="700" fill="#92400E">⚠ Chunk size is a trade-off you tune</text>
  <g font-size="13" fill="#92400E">
    <text x="40" y="462">Too small: a chunk loses its context ("Then roll it back": roll back what?), and answers need many chunks.</text>
    <text x="40" y="484">Too large: one vector averages several topics, so it matches nothing well, and long chunks fill the prompt.</text>
    <text x="40" y="506">A few hundred characters with a little overlap is a common start. Measure retrieval on your own questions.</text>
  </g>
</svg>
