<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" style="font-variant-ligatures: none" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">Layers of an API client</title>
  <desc id="desc">Application code calls InventoryClient methods and gets Asset objects or domain exceptions back. InventoryClient translates HTTP details into those domain results and owns one httpx.Client, which holds the base URL, authorization header, timeout and connection pool. Below the httpx.Client, the transport is the real network in production, and a MockTransport or respx in tests. Settings come from environment variables or a .env file through load_settings, and the token never appears in code or logs.</desc>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97706"/>
    </marker>
  </defs>

  <rect width="960" height="620" fill="#FFFFFF"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">Layers of an API client</text>

  <!-- application -->
  <rect x="40" y="58" width="560" height="64" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="56" y="82" font-size="15" font-weight="700" fill="#1E3A8A">Your application</text>
  <text x="56" y="104" font-size="13" fill="#1E3A8A">the CLI, the incident report, later a FastAPI service: it knows nothing about HTTP</text>

  <line x1="320" y1="122" x2="320" y2="150" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="332" y="140" font-size="12" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" fill="#1E3A8A">client.get_asset("db-03") → Asset</text>

  <!-- InventoryClient -->
  <rect x="40" y="156" width="560" height="120" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="56" y="180" font-size="15" font-weight="700" fill="#1E3A8A"><tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">InventoryClient</tspan>: the domain API</text>
  <g font-size="13" fill="#1E3A8A">
    <text x="56" y="204">• methods named after the business: <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">get_asset</tspan>, <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">list_assets</tspan>, <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">add_note</tspan></text>
    <text x="56" y="226">• returns dataclasses, not raw JSON; follows pagination</text>
    <text x="56" y="248">• turns 404 / 401 / 5xx / timeouts into <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">AssetNotFound</tspan>,</text>
    <text x="72" y="266"><tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">InventoryAuthError</tspan>, <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">InventoryUnavailable</tspan> (with the cause chained)</text>
  </g>

  <line x1="320" y1="276" x2="320" y2="304" stroke="#64748B" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <text x="332" y="294" font-size="12" fill="#334155">owns exactly one</text>

  <!-- httpx.Client -->
  <rect x="40" y="310" width="560" height="96" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <text x="56" y="334" font-size="15" font-weight="700" fill="#334155"><tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">httpx.Client</tspan>: the HTTP plumbing</text>
  <g font-size="13" fill="#334155">
    <text x="56" y="358">base URL · <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">Authorization</tspan> and <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">Accept</tspan> headers · timeout</text>
    <text x="56" y="380">a pool of open connections, reused across requests;</text>
    <text x="56" y="398">closed by <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">with InventoryClient(...) as client:</tspan></text>
  </g>

  <!-- transports -->
  <line x1="180" y1="406" x2="180" y2="446" stroke="#64748B" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <line x1="460" y1="406" x2="460" y2="446" stroke="#0D9488" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-teal)"/>
  <text x="192" y="432" font-size="12" fill="#334155">in production</text>
  <text x="472" y="432" font-size="12" fill="#115E59">in tests</text>

  <rect x="40" y="452" width="270" height="76" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <text x="56" y="476" font-size="14" font-weight="700" fill="#334155">Real transport</text>
  <text x="56" y="498" font-size="13" fill="#334155">TCP/TLS to the network</text>
  <text x="56" y="516" font-size="13" fill="#334155">→ the Asset Inventory service</text>

  <rect x="330" y="452" width="270" height="76" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/>
  <text x="346" y="476" font-size="14" font-weight="700" fill="#115E59">MockTransport or respx</text>
  <text x="346" y="498" font-size="13" fill="#115E59">canned responses and errors;</text>
  <text x="346" y="516" font-size="13" fill="#115E59">no network, fast, repeatable</text>

  <!-- settings -->
  <rect x="640" y="58" width="300" height="218" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="656" y="84" font-size="15" font-weight="700" fill="#92400E">Configuration</text>
  <g font-size="13" fill="#92400E">
    <text x="656" y="108">environment variables, or <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">.env</tspan></text>
    <text x="656" y="126">(git-ignored; <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">.env.example</tspan> is committed)</text>
    <text x="656" y="156" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">load_settings()</text>
    <text x="656" y="176" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">→ Settings(base_url,</text>
    <text x="750" y="194" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">token, timeout)</text>
    <text x="656" y="226" font-weight="700">⚠ The token never appears in</text>
    <text x="656" y="246" font-weight="700">code, logs, errors or repr().</text>
  </g>
  <path d="M640,216 C620,216 615,216 606,216" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="646" y="268" font-size="12" fill="#92400E" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">InventoryClient.from_settings()</text>

  <!-- footer -->
  <rect x="40" y="548" width="900" height="56" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  <text x="56" y="572" font-size="13" fill="#334155"><tspan font-weight="700">Why inject the transport?</tspan> The client's constructor accepts <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">transport=</tspan>, so tests can swap the bottom layer</text>
  <text x="56" y="592" font-size="13" fill="#334155">without changing a line of the code above it. Session 08's async version keeps the same layers.</text>
</svg>
