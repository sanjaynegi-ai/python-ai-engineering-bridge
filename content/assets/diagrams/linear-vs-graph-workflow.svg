<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" style="font-variant-ligatures: none" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">Plain Python or a graph?</title>
  <desc id="desc">Two workflows side by side. On the left, a pipeline: load the reports, triage each one, write the results. It has one path, no loops and nothing to pause for, so plain function calls are enough and a graph would only add ceremony. On the right, the routing workflow: triage may be retried in a loop, may fall back to keyword rules or go straight to review, then a check decides between page, queue and review. With loops, several branches and state shared by many steps, a graph can help: the steps and routes are explicit, it can be drawn and streamed step by step, loops are limited, and with a checkpointer it can pause for a person and resume. The advice: start with plain Python, and move to a graph when the control flow becomes the hard part.</desc>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="960" height="500" fill="#FFFFFF"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">Plain Python or a graph?</text>

  <!-- left: pipeline -->
  <rect x="24" y="60" width="360" height="330" rx="12" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.5"/>
  <text x="40" y="88" font-size="16" font-weight="700" fill="#1E3A8A">A pipeline</text>
  <text x="40" y="108" font-size="13" fill="#1E3A8A">One path, no loops, nothing to wait for</text>

  <g font-size="13" fill="#1E3A8A">
    <rect x="104" y="126" width="200" height="40" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="204" y="151" text-anchor="middle">load the reports</text>
    <line x1="204" y1="166" x2="204" y2="186" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <rect x="104" y="190" width="200" height="40" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="204" y="215" text-anchor="middle">triage each report</text>
    <line x1="204" y1="230" x2="204" y2="250" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <rect x="104" y="254" width="200" height="40" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="204" y="279" text-anchor="middle">write the results</text>
  </g>
  <g font-size="12" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" fill="#1E3A8A">
    <text x="40" y="324">reports = load_reports(path)</text>
    <text x="40" y="342">run = triage_all(triager, reports)</text>
    <text x="40" y="360">out.write_text(run.model_dump_json())</text>
  </g>
  <text x="40" y="380" font-size="13" font-weight="700" fill="#1E3A8A">Plain function calls. A graph adds only ceremony.</text>

  <!-- right: workflow -->
  <rect x="404" y="60" width="532" height="330" rx="12" fill="#F8FAFC" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="420" y="88" font-size="16" font-weight="700" fill="#4C1D95">A workflow</text>
  <text x="420" y="108" font-size="13" fill="#4C1D95">Branches, a loop, and state shared by many steps</text>

  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="430" y="140" width="96" height="36" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
    <text x="478" y="163" fill="#4C1D95">triage</text>
    <rect x="430" y="232" width="96" height="36" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
    <text x="478" y="255" fill="#92400E">fallback</text>
    <rect x="578" y="232" width="96" height="36" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/>
    <text x="626" y="255" fill="#115E59">check</text>
    <rect x="566" y="320" width="64" height="32" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/>
    <text x="598" y="341" fill="#115E59">page</text>
    <rect x="640" y="320" width="64" height="32" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/>
    <text x="672" y="341" fill="#115E59">queue</text>
    <rect x="714" y="320" width="72" height="32" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
    <text x="750" y="341" fill="#92400E">review</text>
  </g>
  <g stroke="#64748B" stroke-width="1.8" fill="none">
    <!-- retry loop -->
    <path d="M 456 140 C 446 112, 512 112, 502 138" marker-end="url(#arrow-slate)"/>
    <!-- triage to fallback -->
    <line x1="478" y1="176" x2="478" y2="228" marker-end="url(#arrow-slate)"/>
    <!-- triage to check -->
    <path d="M 526 158 L 626 158 L 626 228" marker-end="url(#arrow-slate)"/>
    <!-- triage to review (refused) -->
    <path d="M 526 150 L 750 150 L 750 316" marker-end="url(#arrow-slate)"/>
    <!-- fallback to check -->
    <line x1="526" y1="250" x2="574" y2="250" marker-end="url(#arrow-slate)"/>
    <!-- check to actions -->
    <line x1="612" y1="268" x2="600" y2="316" marker-end="url(#arrow-slate)"/>
    <line x1="640" y1="268" x2="668" y2="316" marker-end="url(#arrow-slate)"/>
    <path d="M 674 256 L 734 256 L 734 316" marker-end="url(#arrow-slate)"/>
  </g>
  <text x="514" y="126" font-size="11" fill="#475569">retry</text>

  <g font-size="12" fill="#4C1D95">
    <text x="800" y="150">When a graph helps:</text>
    <text x="800" y="172">• loops, with a limit</text>
    <text x="800" y="192">• several branches</text>
    <text x="800" y="212">• shared state</text>
    <text x="800" y="232">• draw it, stream</text>
    <text x="812" y="250">each step</text>
    <text x="800" y="270">• pause for a person,</text>
    <text x="812" y="288">then resume</text>
    <text x="812" y="306">(checkpointer)</text>
  </g>
  <text x="420" y="380" font-size="13" font-weight="700" fill="#4C1D95">The routes are the hard part: a graph makes them explicit.</text>

  <!-- advice -->
  <rect x="24" y="410" width="912" height="66" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="44" y="438" font-size="14" fill="#92400E"><tspan font-weight="700">Start with plain Python.</tspan> Functions, ifs and a loop are easier to read, debug and test.</text>
  <text x="44" y="462" font-size="14" fill="#92400E">Move to a graph when the control flow, not the individual steps, becomes the hard part.</text>
</svg>
