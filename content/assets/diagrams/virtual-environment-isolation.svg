<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" style="font-variant-ligatures: none" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">Global versus project environments</title>
  <desc id="desc">Left: two projects share one global site-packages directory, so only one pydantic version can be installed and one project breaks. Right: each project has its own uv-managed virtual environment with its own locked pydantic version, while both reuse the same Python interpreter.</desc>

  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
  </defs>

  <!-- Opaque background keeps the diagram readable on GitHub dark mode -->
  <rect width="960" height="560" fill="#FFFFFF"/>

  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">Global versus project environments</text>

  <!-- ===================== Left panel: global install ===================== -->
  <rect x="20" y="58" width="440" height="482" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="240" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#92400E">Without isolation: one shared install</text>

  <rect x="40" y="104" width="190" height="66" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="135" y="131" text-anchor="middle" font-size="15" font-weight="600" fill="#1E3A8A">billing-service</text>
  <text x="135" y="153" text-anchor="middle" font-size="13" fill="#1E3A8A">needs pydantic 1.10</text>

  <rect x="250" y="104" width="190" height="66" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="345" y="131" text-anchor="middle" font-size="15" font-weight="600" fill="#1E3A8A">ai-gateway</text>
  <text x="345" y="153" text-anchor="middle" font-size="13" fill="#1E3A8A">needs pydantic 2.x</text>

  <line x1="135" y1="170" x2="135" y2="240" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
  <line x1="345" y1="170" x2="345" y2="240" stroke="#64748B" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <text x="145" y="210" font-size="12" fill="#B91C1C">import fails</text>

  <rect x="40" y="246" width="400" height="120" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <text x="240" y="274" text-anchor="middle" font-size="15" font-weight="600" fill="#334155">Global site-packages</text>
  <text x="240" y="296" text-anchor="middle" font-size="13" fill="#475569">Only one version of a package can be installed</text>
  <rect x="110" y="314" width="260" height="34" rx="17" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="240" y="336" text-anchor="middle" font-size="13" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" fill="#B91C1C">pydantic 2.14 (last install wins)</text>

  <line x1="240" y1="366" x2="240" y2="402" stroke="#64748B" stroke-width="2" marker-end="url(#arrow-slate)"/>

  <rect x="40" y="408" width="400" height="56" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  <text x="240" y="442" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">System Python 3.13 interpreter</text>

  <text x="240" y="500" text-anchor="middle" font-size="13" font-weight="600" fill="#92400E">⚠ Upgrading for one project silently</text>
  <text x="240" y="520" text-anchor="middle" font-size="13" font-weight="600" fill="#92400E">breaks the other</text>

  <!-- ===================== Right panel: per-project venvs ===================== -->
  <rect x="500" y="58" width="440" height="482" rx="12" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.5"/>
  <text x="720" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#115E59">With isolation: one environment per project</text>

  <rect x="520" y="104" width="190" height="66" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="615" y="131" text-anchor="middle" font-size="15" font-weight="600" fill="#1E3A8A">billing-service</text>
  <text x="615" y="153" text-anchor="middle" font-size="13" fill="#1E3A8A">pyproject.toml + uv.lock</text>

  <rect x="730" y="104" width="190" height="66" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="825" y="131" text-anchor="middle" font-size="15" font-weight="600" fill="#1E3A8A">ai-gateway</text>
  <text x="825" y="153" text-anchor="middle" font-size="13" fill="#1E3A8A">pyproject.toml + uv.lock</text>

  <line x1="615" y1="170" x2="615" y2="200" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="825" y1="170" x2="825" y2="200" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <rect x="520" y="206" width="190" height="160" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="615" y="232" text-anchor="middle" font-size="14" font-weight="700" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" fill="#1E3A8A">.venv/</text>
  <rect x="540" y="248" width="150" height="32" rx="16" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.5"/>
  <text x="615" y="269" text-anchor="middle" font-size="13" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" fill="#115E59">pydantic 1.10.x</text>
  <rect x="540" y="290" width="150" height="32" rx="16" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.5"/>
  <text x="615" y="311" text-anchor="middle" font-size="13" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" fill="#115E59">httpx 0.27</text>
  <text x="615" y="350" text-anchor="middle" font-size="12" fill="#475569">created by uv sync</text>

  <rect x="730" y="206" width="190" height="160" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="825" y="232" text-anchor="middle" font-size="14" font-weight="700" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" fill="#1E3A8A">.venv/</text>
  <rect x="750" y="248" width="150" height="32" rx="16" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.5"/>
  <text x="825" y="269" text-anchor="middle" font-size="13" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" fill="#115E59">pydantic 2.14</text>
  <rect x="750" y="290" width="150" height="32" rx="16" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.5"/>
  <text x="825" y="311" text-anchor="middle" font-size="13" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" fill="#115E59">httpx 0.28</text>
  <text x="825" y="350" text-anchor="middle" font-size="12" fill="#475569">created by uv sync</text>

  <line x1="615" y1="366" x2="615" y2="402" stroke="#64748B" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <line x1="825" y1="366" x2="825" y2="402" stroke="#64748B" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <text x="623" y="390" font-size="12" fill="#475569">uses</text>
  <text x="833" y="390" font-size="12" fill="#475569">uses</text>

  <rect x="520" y="408" width="400" height="56" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  <text x="720" y="434" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">Shared Python 3.13 interpreter</text>
  <text x="720" y="453" text-anchor="middle" font-size="12" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" fill="#475569">uv python install 3.13</text>

  <text x="720" y="500" text-anchor="middle" font-size="13" font-weight="600" fill="#115E59">✓ Each project resolves and locks its own</text>
  <text x="720" y="520" text-anchor="middle" font-size="13" font-weight="600" fill="#115E59">dependencies; uv.lock makes it reproducible</text>
</svg>
