<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="title">Python to AI engineering bridge roadmap</title>
  <desc id="desc">Four connected stages move from existing engineering experience through Python, application engineering, AI integration and a grounded knowledge assistant.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker></defs>
  <rect width="960" height="300" fill="#fff"/><text x="480" y="38" text-anchor="middle" font-size="23" font-weight="700" fill="#0F172A">The bridge: familiar engineering, expressed through Python</text>
  <g font-size="15" text-anchor="middle"><rect x="25" y="92" width="190" height="120" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="120" y="128" font-weight="700" fill="#334155">Experienced engineer</text><text x="120" y="158" fill="#475569">design · APIs · testing</text><text x="120" y="182" fill="#475569">debugging · delivery</text>
  <rect x="270" y="92" width="190" height="120" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="365" y="128" font-weight="700" fill="#1E3A8A">Python fluency</text><text x="365" y="158" fill="#1E40AF">language · packages</text><text x="365" y="182" fill="#1E40AF">tests · project tools</text>
  <rect x="515" y="92" width="190" height="120" rx="10" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/><text x="610" y="128" font-weight="700" fill="#115E59">Application engineering</text><text x="610" y="158" fill="#0F766E">HTTP · validation</text><text x="610" y="182" fill="#0F766E">FastAPI · async</text>
  <rect x="760" y="92" width="175" height="120" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/><text x="847" y="128" font-weight="700" fill="#5B21B6">AI applications</text><text x="847" y="158" fill="#6D28D9">LLMs · RAG · graphs</text><text x="847" y="182" fill="#6D28D9">grounded capstone</text></g>
  <g stroke="#64748B" stroke-width="2.5" marker-end="url(#a)"><line x1="215" y1="152" x2="258" y2="152"/><line x1="460" y1="152" x2="503" y2="152"/><line x1="705" y1="152" x2="748" y2="152"/></g><text x="480" y="265" text-anchor="middle" font-size="14" fill="#475569">The course adds a Python and AI layer; it does not reset your engineering experience.</text>
</svg>
