<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
 <title id="title">From text to token embeddings</title><desc id="desc">Text is split into model-specific tokens. Vocabulary lookup maps each token to an integer ID and then an embedding-table row, producing vectors consumed by Transformer layers.</desc>
 <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker></defs><rect width="960" height="330" fill="#fff"/><text x="480" y="36" text-anchor="middle" font-size="23" font-weight="700" fill="#0F172A">Text becomes numbers before the Transformer can process it</text>
 <g text-anchor="middle"><rect x="25" y="100" width="160" height="110" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="105" y="134" font-size="16" font-weight="700" fill="#1E3A8A">Text</text><text x="105" y="170" font-size="15" fill="#1E40AF">“unbelievable”</text>
 <rect x="225" y="100" width="190" height="110" rx="9" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="320" y="134" font-size="16" font-weight="700" fill="#334155">Tokens</text><text x="320" y="170" font-size="14" fill="#475569">“un” · “believ” · “able”</text>
 <rect x="455" y="100" width="160" height="110" rx="9" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/><text x="535" y="134" font-size="16" font-weight="700" fill="#115E59">Token IDs</text><text x="535" y="170" font-size="15" fill="#0F766E">[431, 9821, 612]</text>
 <rect x="655" y="82" width="280" height="146" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/><text x="795" y="116" font-size="16" font-weight="700" fill="#5B21B6">Embedding-table lookup</text><text x="795" y="149" font-size="14" fill="#6D28D9">431 → [0.12, −0.44, …]</text><text x="795" y="174" font-size="14" fill="#6D28D9">9821 → [0.71, 0.08, …]</text><text x="795" y="199" font-size="14" fill="#6D28D9">612 → [−0.09, 0.35, …]</text></g>
 <g stroke="#64748B" stroke-width="2.5" marker-end="url(#a)"><line x1="185" y1="155" x2="213" y2="155"/><line x1="415" y1="155" x2="443" y2="155"/><line x1="615" y1="155" x2="643" y2="155"/></g><text x="480" y="282" text-anchor="middle" font-size="14" fill="#475569">The vocabulary is the tokenizer’s finite token ↔ ID mapping. Contextual meaning develops in later Transformer layers.</text>
</svg>
