<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" role="img" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="title">Modern model family progression</title><desc id="desc">A base next-token predictor is post-trained into an instruction model. Additional reasoning-oriented training produces reasoning models, while hybrid models expose both fast and deliberate modes.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker></defs><rect width="960" height="310" fill="#fff"/><text x="480" y="38" text-anchor="middle" font-size="23" font-weight="700" fill="#0F172A">The model did not become an assistant during pretraining alone</text><g text-anchor="middle"><rect x="30" y="100" width="190" height="110" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="125" y="134" font-size="17" font-weight="700" fill="#334155">Base model</text><text x="125" y="166" font-size="14" fill="#475569">continues token patterns</text><text x="125" y="188" font-size="13" fill="#475569">pretraining</text><rect x="275" y="100" width="190" height="110" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/><text x="370" y="134" font-size="17" font-weight="700" fill="#5B21B6">Instruct / chat</text><text x="370" y="166" font-size="14" fill="#6D28D9">follows user intent</text><text x="370" y="188" font-size="13" fill="#6D28D9">post-training</text><rect x="520" y="100" width="190" height="110" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/><text x="615" y="134" font-size="17" font-weight="700" fill="#5B21B6">Reasoning</text><text x="615" y="166" font-size="14" fill="#6D28D9">more inference work</text><text x="615" y="188" font-size="13" fill="#6D28D9">complex tasks</text><rect x="765" y="100" width="165" height="110" rx="10" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/><text x="847" y="134" font-size="17" font-weight="700" fill="#115E59">Hybrid</text><text x="847" y="166" font-size="14" fill="#0F766E">fast or deliberate</text><text x="847" y="188" font-size="13" fill="#0F766E">configurable</text></g><g stroke="#7C3AED" stroke-width="2.5" marker-end="url(#a)"><line x1="220" y1="155" x2="263" y2="155"/><line x1="465" y1="155" x2="508" y2="155"/><line x1="710" y1="155" x2="753" y2="155"/></g><text x="480" y="265" text-anchor="middle" font-size="14" fill="#D97706">These are useful engineering categories, not a universal vendor-neutral standard.</text></svg>
