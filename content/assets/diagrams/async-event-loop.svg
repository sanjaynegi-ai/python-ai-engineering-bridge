<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" style="font-variant-ligatures: none" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">The event loop</title>
  <desc id="desc">The event loop runs on one thread. It takes a coroutine from the ready queue and runs it until the coroutine reaches an await on something that isn't ready, such as a network response. The coroutine is then parked in the waiting area, and the loop picks the next ready coroutine. The operating system tells the loop when a socket has data or a timer has expired, and the loop moves the matching coroutine back to the ready queue. A blocking call such as time.sleep or a synchronous HTTP request inside a coroutine never reaches an await, so the loop is stuck and no other coroutine runs.</desc>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#FFFFFF"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">The event loop: one waiter, many tables</text>

  <!-- ready queue -->
  <rect x="40" y="70" width="260" height="230" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="56" y="96" font-size="15" font-weight="700" fill="#1E3A8A">Ready</text>
  <text x="56" y="116" font-size="12" fill="#1E3A8A">can run as soon as the loop is free</text>
  <g font-size="12" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" fill="#1E3A8A">
    <rect x="56" y="132" width="228" height="34" rx="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="70" y="153">fetch("database")</text>
    <rect x="56" y="176" width="228" height="34" rx="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="70" y="197">dashboard() handler</text>
  </g>
  <text x="56" y="236" font-size="12" fill="#1E3A8A">its response arrived, or it was just</text>
  <text x="56" y="254" font-size="12" fill="#1E3A8A">created with create_task / gather</text>

  <!-- loop -->
  <rect x="350" y="110" width="260" height="150" rx="16" fill="#2563EB" stroke="#2563EB" stroke-width="2"/>
  <text x="480" y="148" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">Event loop</text>
  <text x="480" y="174" text-anchor="middle" font-size="13" fill="#FFFFFF">one thread</text>
  <text x="480" y="200" text-anchor="middle" font-size="13" fill="#FFFFFF">runs one coroutine at a time,</text>
  <text x="480" y="220" text-anchor="middle" font-size="13" fill="#FFFFFF">until it reaches an <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">await</tspan></text>
  <text x="480" y="240" text-anchor="middle" font-size="13" fill="#FFFFFF">that has to wait</text>

  <line x1="300" y1="160" x2="346" y2="160" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="323" y="150" text-anchor="middle" font-size="12" fill="#1E3A8A">1 run</text>

  <!-- waiting -->
  <rect x="660" y="70" width="260" height="230" rx="12" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="676" y="96" font-size="15" font-weight="700" fill="#334155">Waiting</text>
  <text x="676" y="116" font-size="12" fill="#334155">parked at an <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">await</tspan>; costs nothing</text>
  <g font-size="12" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" fill="#334155">
    <rect x="676" y="132" width="228" height="34" rx="16" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
    <text x="690" y="153">fetch("network")</text>
    <rect x="676" y="176" width="228" height="34" rx="16" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
    <text x="690" y="197">fetch("platform")</text>
    <rect x="676" y="220" width="228" height="34" rx="16" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
    <text x="690" y="241">asyncio.sleep(0.3)</text>
  </g>

  <line x1="610" y1="160" x2="656" y2="160" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="633" y="150" text-anchor="middle" font-size="12" fill="#1E3A8A">2 await</text>

  <!-- OS -->
  <rect x="40" y="350" width="880" height="70" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <text x="56" y="377" font-size="15" font-weight="700" fill="#334155">Operating system: sockets and timers</text>
  <text x="56" y="401" font-size="13" fill="#334155">does the actual waiting, for every connection at once, and tells the loop which ones are ready</text>

  <line x1="790" y1="300" x2="790" y2="346" stroke="#64748B" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <text x="800" y="328" font-size="12" fill="#334155">requests in flight</text>
  <line x1="170" y1="350" x2="170" y2="304" stroke="#0D9488" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <text x="180" y="331" font-size="12" fill="#115E59"><tspan font-weight="700">3 data ready:</tspan> back to Ready</text>

  <!-- blocking -->
  <rect x="350" y="450" width="570" height="96" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="366" y="476" font-size="15" font-weight="700" fill="#B91C1C">✗ A blocking call inside a coroutine</text>
  <text x="366" y="500" font-size="13" fill="#B91C1C"><tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">time.sleep(2)</tspan>, <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">httpx.get(...)</tspan>, a heavy calculation: there is no <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">await</tspan>,</text>
  <text x="366" y="520" font-size="13" fill="#B91C1C">so the loop is stuck: it never gets control back. Every other coroutine,</text>
  <text x="366" y="538" font-size="13" fill="#B91C1C">and every other request to your FastAPI service, waits until it ends.</text>

  <!-- analogy -->
  <rect x="40" y="450" width="280" height="96" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="56" y="476" font-size="14" font-weight="700" fill="#92400E">⚠ The analogy</text>
  <text x="56" y="498" font-size="12" fill="#92400E">A waiter takes an order, hands it to</text>
  <text x="56" y="516" font-size="12" fill="#92400E">the kitchen, and serves another table.</text>
  <text x="56" y="534" font-size="12" fill="#92400E">Never stand at the kitchen door.</text>

  <text x="480" y="580" text-anchor="middle" font-size="12" fill="#334155">Steps 1 → 2 → 3 repeat for as long as the program runs; that's how one thread keeps many requests in flight.</text>
</svg>
