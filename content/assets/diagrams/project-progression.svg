<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" style="font-variant-ligatures: none" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">How the four projects build on each other</title>
  <desc id="desc">All four projects serve the fictional Orbital Logistics IT operations team, with synthetic data. Project 01, a data processor, turns incident ticket exports into a report, as a tested Python package. Project 02, an API service, starts from Project 01's checkpoint and puts the same domain logic behind FastAPI, with Pydantic contracts and concurrent calls to an asset inventory. Project 03, an LLM application, triages free-text incident reports into structured, validated results, first with a provider SDK and then with LangChain and LangGraph. Project 04, the capstone knowledge assistant, answers questions from runbooks and policies with retrieval-augmented generation and cites its sources.</desc>

  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="960" height="400" fill="#FFFFFF"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">How the four projects build on each other</text>

  <!-- shared domain -->
  <rect x="24" y="56" width="912" height="40" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="480" y="81" text-anchor="middle" font-size="13" fill="#334155">One fictional company, <tspan font-weight="700">Orbital Logistics</tspan>, and its IT operations team: tickets, assets, reports, runbooks. All data is synthetic</text>

  <!-- P01 -->
  <rect x="24" y="120" width="204" height="190" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="40" y="146" font-size="15" font-weight="700" fill="#1E3A8A">01 Data Processor</text>
  <text x="40" y="164" font-size="12" fill="#1E3A8A">Sessions 02–04</text>
  <g font-size="12" fill="#1E3A8A">
    <text x="40" y="190">ticket exports (JSON)</text>
    <text x="40" y="208">→ validation, SLA breaches,</text>
    <text x="52" y="226">per-team metrics</text>
    <text x="40" y="244">→ a JSON report</text>
    <text x="40" y="272" font-weight="700">packages · dataclasses ·</text>
    <text x="40" y="290" font-weight="700">files · pytest</text>
  </g>

  <!-- P02 -->
  <rect x="260" y="120" width="204" height="190" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="276" y="146" font-size="15" font-weight="700" fill="#1E3A8A">02 API Service</text>
  <text x="276" y="164" font-size="12" fill="#1E3A8A">Sessions 05–08</text>
  <g font-size="12" fill="#1E3A8A">
    <text x="276" y="190">the same domain, behind</text>
    <text x="276" y="208">an HTTP API; a concurrent</text>
    <text x="276" y="226">on-call dashboard calling</text>
    <text x="276" y="244">an asset inventory</text>
    <text x="276" y="272" font-weight="700">HTTPX · Pydantic ·</text>
    <text x="276" y="290" font-weight="700">FastAPI · asyncio</text>
  </g>

  <!-- P03 -->
  <rect x="496" y="120" width="204" height="190" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="512" y="146" font-size="15" font-weight="700" fill="#4C1D95">03 LLM Application</text>
  <text x="512" y="164" font-size="12" fill="#4C1D95">Sessions 09–12</text>
  <g font-size="12" fill="#4C1D95">
    <text x="512" y="190">free-text incident reports</text>
    <text x="512" y="208">→ validated, structured</text>
    <text x="524" y="226">triage: priority, team,</text>
    <text x="524" y="244">category, summary</text>
    <text x="512" y="272" font-weight="700">LLM SDK · structured output</text>
    <text x="512" y="290" font-weight="700">· LangChain · LangGraph</text>
  </g>

  <!-- P04 -->
  <rect x="732" y="120" width="204" height="190" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="748" y="146" font-size="15" font-weight="700" fill="#4C1D95">04 Knowledge Assistant</text>
  <text x="748" y="164" font-size="12" fill="#4C1D95">Sessions 14–16 (capstone)</text>
  <g font-size="12" fill="#4C1D95">
    <text x="748" y="190">questions about runbooks</text>
    <text x="748" y="208">and policies → grounded</text>
    <text x="748" y="226">answers with sources</text>
    <text x="748" y="244">(or "not found")</text>
    <text x="748" y="272" font-weight="700">embeddings · vector store ·</text>
    <text x="748" y="290" font-weight="700">FastAPI · Streamlit</text>
  </g>

  <!-- arrows -->
  <line x1="228" y1="215" x2="256" y2="215" stroke="#64748B" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <line x1="464" y1="215" x2="492" y2="215" stroke="#64748B" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <line x1="700" y1="215" x2="728" y2="215" stroke="#64748B" stroke-width="2" marker-end="url(#arrow-slate)"/>

  <!-- what carries over -->
  <g font-size="12" fill="#334155">
    <rect x="24" y="330" width="912" height="54" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <text x="40" y="353"><tspan font-weight="700">What carries over:</tspan> Project 02 starts from Project 01's checkpoint, so it doesn't depend on how far you got. Projects 03 and 04 are</text>
    <text x="40" y="373">new codebases for the same company, and reuse your skills rather than your code: settings, validation, error handling and tests.</text>
  </g>
</svg>
