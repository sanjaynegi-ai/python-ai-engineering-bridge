<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" style="font-variant-ligatures: none" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">Direct SDK versus LangChain</title>
  <desc id="desc">Both versions implement the same Triager protocol, so the batch service, the command line and the tests don't change. The direct version calls the OpenAI SDK's responses.parse with instructions, input and the TriageResult model. The LangChain version builds a chain from a ChatPromptTemplate and a ChatOpenAI model with structured output; underneath, langchain-openai calls the same OpenAI SDK. Both send the same kind of request to the Responses API. LangChain adds layers: a provider-neutral model interface and exceptions, composition, and provider swapping, at the cost of more code you didn't write between you and the HTTP request.</desc>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="960" height="560" fill="#FFFFFF"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">Direct SDK versus LangChain</text>

  <!-- shared top -->
  <rect x="200" y="56" width="560" height="56" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="480" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#1E3A8A">Your application: <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-weight="400">triage_all(triager, reports)</tspan></text>
  <text x="480" y="100" text-anchor="middle" font-size="13" fill="#1E3A8A">depends only on the <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">Triager</tspan> protocol: either version plugs in</text>

  <line x1="320" y1="112" x2="230" y2="142" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="640" y1="112" x2="730" y2="142" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- direct column -->
  <rect x="24" y="146" width="420" height="180" rx="12" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.5"/>
  <text x="40" y="172" font-size="16" font-weight="700" fill="#1E3A8A">Direct: <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-weight="400">OpenAITriager</tspan> (Session 09)</text>
  <rect x="40" y="186" width="388" height="78" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <g font-size="12" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" fill="#1E3A8A">
    <text x="54" y="208">client.responses.parse(</text>
    <text x="70" y="226">instructions=..., input=report.text,</text>
    <text x="70" y="244">text_format=TriageResult, ...)</text>
  </g>
  <line x1="234" y1="264" x2="234" y2="344" stroke="#64748B" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <text x="246" y="292" font-size="12" fill="#334155">your code talks to</text>
  <text x="246" y="310" font-size="12" fill="#334155">the SDK directly</text>

  <!-- langchain column -->
  <rect x="516" y="146" width="420" height="180" rx="12" fill="#F8FAFC" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="532" y="172" font-size="16" font-weight="700" fill="#4C1D95">LangChain: <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-weight="400">LangChainTriager</tspan> (Session 10)</text>
  <rect x="532" y="186" width="388" height="62" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <g font-size="12" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" fill="#4C1D95">
    <text x="546" y="208">PROMPT | ChatOpenAI(...)</text>
    <text x="562" y="226">.with_structured_output(TriageResult)</text>
  </g>
  <text x="546" y="242" font-size="11" fill="#4C1D95">langchain-core: prompts, messages, runnables, errors</text>
  <line x1="726" y1="248" x2="726" y2="270" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <rect x="532" y="274" width="388" height="40" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="546" y="299" font-size="12" fill="#4C1D95"><tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">langchain-openai</tspan>: translates messages and options for OpenAI</text>
  <line x1="726" y1="314" x2="726" y2="344" stroke="#64748B" stroke-width="2" marker-end="url(#arrow-slate)"/>

  <!-- shared SDK and API -->
  <rect x="40" y="348" width="880" height="54" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <text x="480" y="371" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">The same OpenAI SDK, and the same request: <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-weight="400">POST /v1/responses</tspan></text>
  <text x="480" y="391" text-anchor="middle" font-size="12" fill="#334155">timeouts and retries come from the SDK in both versions; the structured-output schema is the same</text>

  <!-- comparison -->
  <g font-size="12">
    <rect x="24" y="434" width="420" height="110" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="40" y="456" font-weight="700" fill="#1E3A8A">You get</text>
    <text x="40" y="476" fill="#1E3A8A">• one layer between you and the API: easy to debug</text>
    <text x="40" y="494" fill="#1E3A8A">• the provider's own features, as soon as they ship</text>
    <text x="40" y="512" fill="#1E3A8A">• you write the error mapping, and any provider switch</text>
    <text x="40" y="530" fill="#1E3A8A">• fewer dependencies to upgrade</text>
    <rect x="516" y="434" width="420" height="110" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="532" y="456" font-weight="700" fill="#4C1D95">You get</text>
    <text x="532" y="476" fill="#4C1D95">• one model interface for many providers</text>
    <text x="532" y="494" fill="#4C1D95">• composition: batch, retry, fallbacks, streaming</text>
    <text x="532" y="512" fill="#4C1D95">• provider-neutral exceptions (not quite complete)</text>
    <text x="532" y="530" fill="#4C1D95">• more layers to read when something goes wrong</text>
  </g>
</svg>
