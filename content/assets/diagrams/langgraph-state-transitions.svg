<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" style="font-variant-ligatures: none" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">The routing workflow as a LangGraph graph</title>
  <desc id="desc">The graph starts at triage, which calls the LLM triager. A routing function then chooses the next node: check if the triage succeeded; triage again if the output was invalid and attempts are below the maximum; fallback, which uses keyword rules, if the provider is unavailable or the output was invalid at the maximum; review if the model refused. Fallback always leads to check. Check applies the business rules, and a second routing function chooses review if any rule is broken, page for a P1, and queue otherwise. Page, queue and review lead to the end. Solid arrows are fixed edges; dashed arrows are conditional edges chosen by a routing function. On the right, the state that every node shares: report from the input, attempts, status and error written by triage, triage written by triage or fallback, reasons by check, dispatch by page, queue or review, and path, which every node appends its own name to through a reducer. A node returns only the keys it changes; LangGraph replaces each key except path, which it appends to. A recursion limit of max_attempts plus 4 stops a routing bug from looping.</desc>

  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="960" height="640" fill="#FFFFFF"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">The routing workflow as a LangGraph graph</text>

  <!-- START -->
  <rect x="250" y="62" width="100" height="30" rx="15" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <text x="300" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">START</text>
  <line x1="300" y1="92" x2="300" y2="126" stroke="#64748B" stroke-width="2" marker-end="url(#arrow-slate)"/>

  <!-- triage -->
  <rect x="220" y="130" width="160" height="56" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="300" y="153" text-anchor="middle" font-size="15" font-weight="700" fill="#4C1D95">triage</text>
  <text x="300" y="174" text-anchor="middle" font-size="12" fill="#4C1D95">calls the LLM triager</text>

  <!-- retry loop -->
  <path d="M 380 140 C 432 118, 432 168, 384 156" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-slate)"/>
  <text x="396" y="116" font-size="12" fill="#334155">invalid output, attempts &lt; max</text>

  <!-- fallback -->
  <rect x="40" y="250" width="150" height="56" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="115" y="273" text-anchor="middle" font-size="15" font-weight="700" fill="#92400E">fallback</text>
  <text x="115" y="294" text-anchor="middle" font-size="12" fill="#92400E">keyword rules</text>
  <path d="M 230 186 L 150 246" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-slate)"/>
  <text x="34" y="214" font-size="12" fill="#334155">unavailable, or</text>
  <text x="34" y="230" font-size="12" fill="#334155">invalid at max</text>

  <!-- check -->
  <rect x="220" y="350" width="160" height="56" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/>
  <text x="300" y="373" text-anchor="middle" font-size="15" font-weight="700" fill="#115E59">check</text>
  <text x="300" y="394" text-anchor="middle" font-size="12" fill="#115E59">applies the business rules</text>
  <line x1="300" y1="186" x2="300" y2="346" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-slate)"/>
  <text x="308" y="266" font-size="12" fill="#334155">ok</text>
  <path d="M 115 306 L 115 378 L 216 378" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow-slate)"/>

  <!-- refused route -->
  <path d="M 380 176 L 530 176 L 530 476" fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-slate)"/>
  <text x="538" y="240" font-size="12" fill="#334155">refused</text>

  <!-- actions -->
  <rect x="40" y="480" width="130" height="50" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/>
  <text x="105" y="502" text-anchor="middle" font-size="15" font-weight="700" fill="#115E59">page</text>
  <text x="105" y="520" text-anchor="middle" font-size="12" fill="#115E59">the team's on-call</text>
  <rect x="235" y="480" width="130" height="50" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/>
  <text x="300" y="502" text-anchor="middle" font-size="15" font-weight="700" fill="#115E59">queue</text>
  <text x="300" y="520" text-anchor="middle" font-size="12" fill="#115E59">the team's backlog</text>
  <rect x="440" y="480" width="130" height="50" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="505" y="502" text-anchor="middle" font-size="15" font-weight="700" fill="#92400E">review</text>
  <text x="505" y="520" text-anchor="middle" font-size="12" fill="#92400E">a person decides</text>

  <g fill="none" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 4">
    <path d="M 250 406 L 130 476" marker-end="url(#arrow-slate)"/>
    <line x1="300" y1="406" x2="300" y2="476" marker-end="url(#arrow-slate)"/>
    <path d="M 350 406 L 470 476" marker-end="url(#arrow-slate)"/>
  </g>
  <g font-size="12" fill="#334155">
    <text x="104" y="438">P1, no rule</text>
    <text x="104" y="454">broken</text>
    <text x="308" y="446">P2–P4</text>
    <text x="410" y="430">a rule</text>
    <text x="410" y="446">broken</text>
  </g>

  <!-- END -->
  <rect x="250" y="590" width="100" height="30" rx="15" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <text x="300" y="610" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">END</text>
  <g fill="none" stroke="#64748B" stroke-width="2">
    <path d="M 105 530 L 105 605 L 246 605" marker-end="url(#arrow-slate)"/>
    <line x1="300" y1="530" x2="300" y2="586" marker-end="url(#arrow-slate)"/>
    <path d="M 505 530 L 505 605 L 354 605" marker-end="url(#arrow-slate)"/>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#334155">
    <line x1="620" y1="566" x2="660" y2="566" stroke="#64748B" stroke-width="2"/>
    <text x="668" y="570">fixed edge</text>
    <line x1="620" y1="590" x2="660" y2="590" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 4"/>
    <text x="668" y="594">conditional edge: a routing function picks one</text>
  </g>

  <!-- state panel -->
  <rect x="604" y="62" width="332" height="472" rx="12" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.5"/>
  <text x="620" y="90" font-size="16" font-weight="700" fill="#1E3A8A">TriageState: shared by every node</text>
  <text x="620" y="112" font-size="12" fill="#1E3A8A">key · written by</text>
  <g font-size="13" fill="#1E3A8A">
    <g font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-weight="700">
      <text x="620" y="140">report</text>
      <text x="620" y="166">attempts</text>
      <text x="620" y="192">status, error</text>
      <text x="620" y="218">triage</text>
      <text x="620" y="244">reasons</text>
      <text x="620" y="270">dispatch</text>
      <text x="620" y="296">path</text>
    </g>
    <text x="750" y="140">the input</text>
    <text x="750" y="166">triage (+1 each call)</text>
    <text x="750" y="192">triage</text>
    <text x="750" y="218">triage or fallback</text>
    <text x="750" y="244">check</text>
    <text x="750" y="270">page, queue, review</text>
    <text x="750" y="296">every node</text>
  </g>
  <rect x="620" y="314" width="300" height="78" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <g font-size="12" fill="#1E3A8A">
    <text x="634" y="336">A node returns only the keys it changes:</text>
    <text x="634" y="356" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">{"reasons": [...], "path": ["check"]}</text>
    <text x="634" y="378">LangGraph merges it into the state.</text>
  </g>
  <g font-size="12" fill="#1E3A8A">
    <text x="620" y="414">Each key is <tspan font-weight="700">replaced</tspan>, except <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">path</tspan>:</text>
    <text x="620" y="434" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">Annotated[list[str], operator.add]</text>
    <text x="620" y="454">Its <tspan font-weight="700">reducer</tspan> appends, so a run records</text>
    <text x="620" y="472" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">["triage", "triage", "check", "page"]</text>
  </g>
  <rect x="620" y="486" width="300" height="38" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="634" y="510" font-size="12" fill="#92400E"><tspan font-weight="700">⚠ recursion_limit</tspan> = max_attempts + 4 stops loops</text>
</svg>
