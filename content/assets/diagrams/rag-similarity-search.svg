<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><title id="title">RAG retrieval with cosine similarity</title><desc id="desc">A query and document chunks become embedding vectors. Cosine similarity ranks chunks by the angle between vectors, and the best evidence is placed into model context.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker></defs><rect width="960" height="350" fill="#fff"/><text x="480" y="38" text-anchor="middle" font-size="23" font-weight="700" fill="#0F172A">RAG retrieves evidence before asking the model to answer</text><g text-anchor="middle"><rect x="25" y="100" width="160" height="110" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="105" y="136" font-size="17" font-weight="700" fill="#1E3A8A">Question</text><text x="105" y="170" font-size="14" fill="#1E40AF">query vector q</text><rect x="230" y="78" width="210" height="154" rx="9" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/><text x="335" y="114" font-size="17" font-weight="700" fill="#115E59">Stored chunks</text><text x="335" y="148" font-size="14" fill="#0F766E">d₁ · d₂ · d₃ · …</text><text x="335" y="178" font-size="13" fill="#0F766E">text + metadata + vector</text><rect x="485" y="78" width="210" height="154" rx="9" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="590" y="114" font-size="17" font-weight="700" fill="#334155">Rank similarity</text><text x="590" y="151" font-size="15" fill="#475569">cos(q,d) = q·d</text><line x1="530" y1="160" x2="650" y2="160" stroke="#64748B"/><text x="590" y="183" font-size="15" fill="#475569">‖q‖ ‖d‖</text><text x="590" y="211" font-size="13" fill="#475569">= cos θ</text><rect x="740" y="100" width="195" height="110" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/><text x="837" y="136" font-size="17" font-weight="700" fill="#5B21B6">LLM context</text><text x="837" y="168" font-size="14" fill="#6D28D9">question + top chunks</text><text x="837" y="190" font-size="13" fill="#6D28D9">answer + sources</text></g><g stroke="#64748B" stroke-width="2.5" marker-end="url(#a)"><line x1="185" y1="155" x2="218" y2="155"/><line x1="440" y1="155" x2="473" y2="155"/><line x1="695" y1="155" x2="728" y2="155"/></g><text x="480" y="295" text-anchor="middle" font-size="14" fill="#475569">A score near 1 means similar direction—not guaranteed truth or relevance. Retrieval still needs evaluation.</text></svg>
