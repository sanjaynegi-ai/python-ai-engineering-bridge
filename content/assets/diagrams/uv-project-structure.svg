<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" style="font-variant-ligatures: none" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">Anatomy of a uv project</title>
  <desc id="desc">Files committed to git: pyproject.toml declares dependency ranges, uv.lock records the exact resolved versions, .python-version names the interpreter, and main.py is the code. uv lock turns pyproject.toml into uv.lock. uv sync installs exactly what uv.lock lists into .venv, which is generated on each machine and git-ignored. .python-version selects the CPython interpreter that .venv is based on. uv add and uv run chain these steps together.</desc>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#FFFFFF"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">Anatomy of a uv project</text>

  <!-- ============ Left: committed ============ -->
  <rect x="20" y="58" width="420" height="420" rx="12" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.5"/>
  <text x="230" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A8A">Committed to git (shared with the team)</text>

  <rect x="44" y="104" width="372" height="78" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="62" y="132" font-size="15" font-weight="700" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" fill="#1E3A8A">pyproject.toml</text>
  <text x="62" y="154" font-size="13" fill="#1E3A8A">What you want: dependency ranges,</text>
  <text x="62" y="172" font-size="13" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" fill="#1E3A8A">"rich&gt;=15.0.0", requires-python</text>

  <line x1="230" y1="182" x2="230" y2="234" stroke="#0D9488" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <rect x="240" y="196" width="140" height="24" rx="4" fill="#F8FAFC"/>
  <text x="244" y="213" font-size="13" font-weight="600" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" fill="#115E59">uv lock</text>
  <text x="310" y="213" font-size="12" fill="#475569">(resolve)</text>

  <rect x="44" y="240" width="372" height="78" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/>
  <text x="62" y="268" font-size="15" font-weight="700" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" fill="#115E59">uv.lock</text>
  <text x="62" y="290" font-size="13" fill="#115E59">What you get: exact versions and hashes</text>
  <text x="62" y="308" font-size="13" fill="#115E59">for every package, including transitive ones</text>

  <rect x="44" y="340" width="372" height="58" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="62" y="366" font-size="15" font-weight="700" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" fill="#1E3A8A">.python-version</text>
  <text x="62" y="386" font-size="13" fill="#1E3A8A">Which interpreter: 3.13</text>

  <rect x="44" y="410" width="372" height="50" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="62" y="441" font-size="15" font-weight="700" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" fill="#1E3A8A">main.py</text>
  <text x="150" y="441" font-size="13" fill="#1E3A8A">your code</text>

  <!-- ============ Right: generated ============ -->
  <rect x="540" y="58" width="400" height="420" rx="12" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="740" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">Generated on each machine (git-ignored)</text>

  <rect x="564" y="190" width="352" height="160" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <text x="740" y="218" text-anchor="middle" font-size="15" font-weight="700" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" fill="#334155">.venv/</text>
  <rect x="604" y="234" width="272" height="30" rx="15" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.5"/>
  <text x="740" y="254" text-anchor="middle" font-size="13" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" fill="#115E59">rich 15.0.0 (+ 3 transitive)</text>
  <rect x="604" y="272" width="272" height="30" rx="15" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.5"/>
  <text x="740" y="292" text-anchor="middle" font-size="13" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" fill="#115E59">ruff 0.17.1 (dev group)</text>
  <text x="740" y="332" text-anchor="middle" font-size="12" fill="#475569">Disposable: delete it and run uv sync</text>

  <line x1="416" y1="279" x2="560" y2="279" stroke="#0D9488" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <text x="488" y="268" text-anchor="middle" font-size="13" font-weight="600" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" fill="#115E59">uv sync</text>
  <text x="488" y="298" text-anchor="middle" font-size="12" fill="#475569">install exactly</text>

  <rect x="564" y="394" width="352" height="66" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  <text x="740" y="422" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">CPython 3.13 interpreter</text>
  <text x="740" y="444" text-anchor="middle" font-size="12" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" fill="#475569">uv python install 3.13</text>

  <line x1="416" y1="369" x2="560" y2="420" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="470" y="374" text-anchor="middle" font-size="12" fill="#1E3A8A">selects</text>

  <line x1="740" y1="394" x2="740" y2="354" stroke="#64748B" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <text x="750" y="380" font-size="12" fill="#475569">base for</text>

  <!-- ============ Command shortcuts ============ -->
  <rect x="20" y="498" width="920" height="84" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  <text x="44" y="528" font-size="14" font-weight="700" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" fill="#1E3A8A">uv add rich</text>
  <text x="250" y="528" font-size="13" fill="#334155">edit pyproject.toml  →  uv lock  →  uv sync</text>
  <text x="44" y="562" font-size="14" font-weight="700" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" fill="#1E3A8A">uv run main.py</text>
  <text x="250" y="562" font-size="13" fill="#334155">check the lock  →  sync .venv if needed  →  run with .venv's Python</text>
</svg>
