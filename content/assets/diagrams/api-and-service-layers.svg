<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" style="font-variant-ligatures: none" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">The API layer and the service layer</title>
  <desc id="desc">HTTP clients, including browsers, other teams' services and TestClient, call the API layer. The API layer, api.py and schemas.py, knows HTTP: routes, query parameters, status codes, response schemas and exception handlers, and gets the TicketService through Depends(get_service). In tests, app.dependency_overrides replaces get_service with a fake. The API layer makes plain Python calls on the service layer, TicketService in service.py, which knows nothing about HTTP and raises domain exceptions such as TicketNotFoundError. The service uses the domain code, models, loading, summary, report and settings, which the incident-report command line also uses. At the bottom are the export files and the INCIDENT_ environment variables.</desc>

  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97706"/>
    </marker>
  </defs>

  <rect width="960" height="640" fill="#FFFFFF"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">The API layer and the service layer</text>

  <!-- clients -->
  <rect x="40" y="60" width="180" height="44" rx="16" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <text x="130" y="87" text-anchor="middle" font-size="13" fill="#334155">browser on <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">/docs</tspan>, curl</text>
  <rect x="240" y="60" width="180" height="44" rx="16" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <text x="330" y="87" text-anchor="middle" font-size="13" fill="#334155">other teams' services</text>
  <rect x="440" y="60" width="180" height="44" rx="16" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <text x="530" y="87" text-anchor="middle" font-size="13" fill="#334155">TestClient in tests</text>
  <line x1="330" y1="104" x2="330" y2="136" stroke="#64748B" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <text x="342" y="125" font-size="12" fill="#334155">HTTP requests and JSON</text>

  <!-- API layer -->
  <rect x="40" y="140" width="580" height="150" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="56" y="165" font-size="16" font-weight="700" fill="#1E3A8A">API layer: knows HTTP</text>
  <text x="604" y="165" text-anchor="end" font-size="12" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" fill="#1E3A8A">api.py, schemas.py</text>
  <g font-size="13" fill="#1E3A8A">
    <text x="56" y="191">• routes: methods, paths, query parameters, status codes</text>
    <text x="56" y="213">• schemas: <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">TicketOut</tspan>, <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">TicketPage</tspan>, <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">TicketFilters</tspan>: the public contract</text>
    <text x="56" y="235">• exception handlers: domain exceptions → 404, 409</text>
    <text x="56" y="257">• gets its service from <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">Depends(get_service)</tspan>; never builds one</text>
    <text x="56" y="279">• thin: each route is a few lines</text>
  </g>

  <!-- override -->
  <rect x="660" y="140" width="260" height="150" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="676" y="165" font-size="15" font-weight="700" fill="#92400E">In tests</text>
  <text x="676" y="190" font-size="12" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" fill="#92400E">app.dependency_overrides[</text>
  <text x="692" y="208" font-size="12" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" fill="#92400E">get_service</text>
  <text x="676" y="226" font-size="12" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" fill="#92400E">] = lambda: fake_service</text>
  <text x="676" y="252" font-size="13" fill="#92400E">routes receive the fake instead;</text>
  <text x="676" y="272" font-size="13" fill="#92400E">no files, no startup data</text>
  <line x1="660" y1="257" x2="624" y2="257" stroke="#D97706" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-amber)"/>

  <!-- calls between layers -->
  <line x1="200" y1="290" x2="200" y2="336" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="212" y="312" font-size="12" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" fill="#1E3A8A">service.find(...)</text>
  <text x="212" y="328" font-size="12" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" fill="#1E3A8A">service.add(ticket)</text>
  <line x1="560" y1="336" x2="560" y2="294" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="548" y="312" text-anchor="end" font-size="12" fill="#1E3A8A">Ticket, Report,</text>
  <text x="548" y="328" text-anchor="end" font-size="12" fill="#1E3A8A">or a domain exception</text>

  <!-- service layer -->
  <rect x="40" y="340" width="580" height="112" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="56" y="365" font-size="16" font-weight="700" fill="#1E3A8A">Service layer: no HTTP</text>
  <text x="604" y="365" text-anchor="end" font-size="12" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" fill="#1E3A8A">service.py</text>
  <g font-size="13" fill="#1E3A8A">
    <text x="56" y="391">• <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">TicketService</tspan>: <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">find</tspan>, <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">get</tspan>, <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">add</tspan>, <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">report</tspan>; holds tickets in memory</text>
    <text x="56" y="413">• raises <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">TicketNotFoundError</tspan>, <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">DuplicateTicketError</tspan>, not HTTPException</text>
    <text x="56" y="435">• testable with plain pytest: no server, no TestClient</text>
  </g>

  <!-- CLI -->
  <rect x="660" y="340" width="260" height="112" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="676" y="365" font-size="15" font-weight="700" fill="#1E3A8A">Command line</text>
  <text x="676" y="390" font-size="12" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" fill="#1E3A8A">cli.py: incident-report</text>
  <text x="676" y="414" font-size="13" fill="#1E3A8A">a second front end on the</text>
  <text x="676" y="434" font-size="13" fill="#1E3A8A">same domain code</text>

  <line x1="330" y1="452" x2="330" y2="484" stroke="#0D9488" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <line x1="790" y1="452" x2="790" y2="484" stroke="#0D9488" stroke-width="2" marker-end="url(#arrow-teal)"/>

  <!-- domain -->
  <rect x="40" y="488" width="880" height="64" rx="12" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/>
  <text x="56" y="513" font-size="16" font-weight="700" fill="#115E59">Domain and data: shared by both front ends</text>
  <text x="56" y="537" font-size="13" fill="#115E59"><tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">models.py</tspan> (Ticket, Report) · <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">loading.py</tspan> · <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">summary.py</tspan> · <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">report.py</tspan> · <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">settings.py</tspan>: Sessions 03–06, unchanged</text>

  <line x1="480" y1="552" x2="480" y2="580" stroke="#64748B" stroke-width="2" marker-end="url(#arrow-slate)"/>

  <!-- infrastructure -->
  <rect x="40" y="584" width="880" height="44" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <text x="480" y="611" text-anchor="middle" font-size="13" fill="#334155">export files in <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">data/exports/</tspan> · <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">INCIDENT_*</tspan> environment variables and <tspan font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">.env</tspan></text>
</svg>
